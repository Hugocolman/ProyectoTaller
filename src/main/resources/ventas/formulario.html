<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Facturación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="navbar :: navbar"></div>

    <div class="container mt-4">
        <h2 class="text-center text-primary">Formulario de Facturación de Venta</h2>

        <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post" class="mt-4">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Cliente</label>
                <input type="text" class="form-control" th:field="*{cliente}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" th:field="*{fecha}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Método de Pago</label>
                <select class="form-control" th:field="*{metodoPago}" required>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Transferencia">Transferencia</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Descripción</label>
                <textarea class="form-control" th:field="*{descripcion}"></textarea>
            </div>

            <h5 class="text-primary">Productos de la Venta</h5>
            <div id="carrito-productos">
                <div class="row mb-2 align-items-end" th:each="detalle, iterStat : *{detalles}">
                    <div class="col-md-5">
                        <label>Producto</label>
                        <select class="form-control" th:field="*{detalles[__${iterStat.index}__].producto.id}" required>
                            <option th:each="producto : ${productos}" th:value="${producto.id}" th:text="${producto.nombre + ' | $' + producto.precio + ' | Stock: ' + producto.cantidad}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label>Cantidad</label>
                        <input type="number" min="1" class="form-control" th:field="*{detalles[__${iterStat.index}__].cantidad}" required>
                    </div>
                    <div class="col-md-2">
                        <label>Precio</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{detalles[__${iterStat.index}__].precioUnitario}" readonly>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-danger" onclick="eliminarProducto(this)">Eliminar</button>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <button type="button" class="btn btn-outline-primary" onclick="agregarProducto()">Agregar Producto</button>
            </div>

            <div class="mb-3">
                <label class="form-label">Total</label>
                <input type="number" step="0.01" class="form-control" th:field="*{total}" readonly>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success">Guardar Venta</button>
                <a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>

        <script>
        // Lógica JS para agregar/eliminar productos dinámicamente
        function agregarProducto() {
            const carrito = document.getElementById('carrito-productos');
            const rows = carrito.querySelectorAll('.row');
            const lastIndex = rows.length;
            // Clonar la primera fila (o una plantilla oculta)
            let template = rows[0];
            if (!template) return;
            let clone = template.cloneNode(true);
            // Limpiar valores
            clone.querySelectorAll('input, select').forEach(el => {
                if (el.tagName === 'SELECT') el.selectedIndex = 0;
                else el.value = '';
                // Actualizar los índices de los campos
                el.name = el.name.replace(/detalles\[\d+\]/, 'detalles['+lastIndex+']');
            });
            carrito.appendChild(clone);
        }
        function eliminarProducto(btn) {
            const row = btn.closest('.row');
            if (row.parentNode.childElementCount > 1) row.remove();
        }
        </script>
    </div>

    <!-- Footer -->
    <div th:replace="footer :: footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
