<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/layout :: head('Lista de Usuarios')"></head>
    <body th:replace="fragments/layout :: shell(~{::section})">
        <section>

        <div class="container mt-5">
            <h2 class="text-center">Lista de Usuarios</h2>
            <table class="table table-hover table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.id}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.email}"></td>
                        <td th:text="${usuario.rol.nombre}"></td>
                        <td>
                            <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-primary btn-sm">Editar</a>
                            <form th:action="@{/usuarios/eliminar/{id}(id=${usuario.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar este usuario?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <a href="/usuarios/nuevo" class="btn btn-success mt-3">Nuevo Usuario</a>
        </div>

        </section>
    </body>
</html>
