<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'">Formulario de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="navbar :: navbar"></div>
   
    <div class="container mt-5">
        <!-- Título dinámico: Nuevo o Editar Usuario -->
        <h2 th:text="${usuario.id != null} ? 'Editar Usuario' : 'Nuevo Usuario'"></h2>
        
        <!-- Formulario -->
        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" class="mt-4">
            <input type="hidden" th:field="*{id}" />

           

            <!-- Nombre -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" id="nombre" class="form-control" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" th:field="*{email}" id="email" class="form-control" required>
            </div>

            

            <!-- Rol -->
            <div class="mb-3">
                <label for="rol" class="form-label">Rol</label>
                <select th:field="*{rol.id}" id="rol" class="form-select" required>
                    <option th:each="rol : ${roles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
                </select>
            </div>

            <!-- Botones -->
            <button type="submit" class="btn btn-primary" th:text="${usuario.id == null ? 'Guardar' : 'Actualizar'}"></button>
            <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    </section>
    </body>
    </html>
