<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Remito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container mt-4">
        <h2>Detalle de Remito</h2>
        <div class="mb-3">
            <strong>Número:</strong> <span th:text="${remito.numero}"></span><br>
            <strong>Pedido:</strong> <span th:text="${remito.pedido != null ? remito.pedido.id : ''}"></span><br>
            <strong>Fecha:</strong> <span th:text="${remito.fecha != null ? remito.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></span><br>
            <strong>Estado:</strong> <span th:text="${remito.estado}"></span><br>
        </div>
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="det : ${remito.detalles}">
                    <td th:text="${det.producto != null ? det.producto.nombre : ''}"></td>
                    <td th:text="${det.cantidad}"></td>
                </tr>
            </tbody>
        </table>
        <div class="mt-3">
            <a th:href="@{/remitos}" class="btn btn-secondary">Volver</a>
            <a th:href="@{/remitos/imprimir/{id}(id=${remito.id})}" class="btn btn-info">Imprimir</a>
            <form th:if="${remito.estado != 'ANULADO'}" th:action="@{/facturas/emitir/{remitoId}(remitoId=${remito.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-primary" onclick="return confirm('Â¿Emitir factura para este remito?');">Facturar</button>
            </form>
            <form th:if="${remito.estado != 'ANULADO'}" th:action="@{/remitos/anular/{id}(id=${remito.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-warning" onclick="return confirm('Â¿Anular remito? Esto repondrÃ¡ el stock entregado.')">Anular</button>
            </form>
        </div>
    </div>
    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
