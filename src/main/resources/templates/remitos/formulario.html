<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Remito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container mt-4">
        <h2>Generar Remito</h2>
        <form th:action="@{/remitos/guardar}" method="post">
            <input type="hidden" name="pedidoId" th:value="${remito.pedido.id}">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th>Pendiente</th>
                        <th>Entregar ahora</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ln : ${lineas}">
                        <td>
                            <input type="hidden" name="productoId" th:value="${ln['producto'].id}">
                            <span th:text="${ln['producto'].nombre}"></span>
                        </td>
                        <td th:text="${ln['pendiente']}"></td>
                        <td>
                            <input class="form-control" type="number" name="entregar" min="0" th:attr="max=${ln['pendiente']}" th:value="${ln['pendiente']}">
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Confirmar Entrega</button>
                <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
