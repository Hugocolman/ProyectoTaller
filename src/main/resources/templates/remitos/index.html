<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remitos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container mt-4">
        <h2 class="text-center">Remitos</h2>
        <table class="table table-hover table-bordered">
            <thead class="table-primary">
                <tr>
                    <th>Número</th>
                    <th>Pedido</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r, iter : ${page.content}">
                    <td th:text="${r.numero}"></td>
                    <td th:text="${r.pedido != null ? r.pedido.id : ''}"></td>
                    <td th:text="${r.fecha != null ? r.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></td>
                    <td>
                        <span class="badge" th:classappend="${r.estado == 'ANULADO'} ? 'bg-secondary' : 'bg-dark'" th:text="${r.estado}"></span>
                    </td>
                    <td>
                        <a th:href="@{/remitos/detalle/{id}(id=${r.id})}" class="btn btn-secondary btn-sm">Detalle</a>
                        <a th:href="@{/remitos/imprimir/{id}(id=${r.id})}" class="btn btn-info btn-sm">Imprimir</a>
                        <form th:if="${r.estado != 'ANULADO'}" th:action="@{/remitos/anular/{id}(id=${r.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-warning btn-sm" onclick="return confirm('¿Anular remito? Esto repondrá el stock entregado.')">Anular</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <nav aria-label="Paginación">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${page.first}? 'disabled'">
                    <a class="page-link" th:href="@{/remitos(page=${page.number-1},size=${page.size})}">Anterior</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages-1)}" th:classappend="${i == page.number}? 'active'">
                    <a class="page-link" th:text="${i+1}" th:href="@{/remitos(page=${i},size=${page.size})}"></a>
                </li>
                <li class="page-item" th:classappend="${page.last}? 'disabled'">
                    <a class="page-link" th:href="@{/remitos(page=${page.number+1},size=${page.size})}">Siguiente</a>
                </li>
            </ul>
        </nav>
    </div>
    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
