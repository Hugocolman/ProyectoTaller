<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Presupuesto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container mt-4">
        <h2>Detalle de Presupuesto</h2>
        <div class="mb-3">
            <strong>Cliente:</strong> <span th:text="${presupuesto.cliente}"></span><br>
            <strong>Fecha:</strong> <span th:text="${presupuesto.fecha != null ? presupuesto.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></span><br>
            <strong>Válido Hasta:</strong> <span th:text="${presupuesto.validoHasta != null ? presupuesto.validoHasta.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></span><br>
            <strong>Estado:</strong> <span th:text="${presupuesto.estado}"></span><br>
            <strong>Condiciones:</strong> <span th:text="${presupuesto.condiciones}"></span>
        </div>
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="det : ${presupuesto.detalles}">
                    <td th:text="${det.producto != null ? det.producto.nombre : ''}"></td>
                    <td th:text="${det.cantidad}"></td>
                    <td th:text="${det.precioUnitario}"></td>
                    <td th:text="${det.cantidad * det.precioUnitario}"></td>
                </tr>
            </tbody>
        </table>
        <div class="text-end">
            <strong>Total: </strong><span th:text="${presupuesto.total}"></span>
        </div>
        <div class="mt-3">
            <a th:href="@{/presupuestos}" class="btn btn-secondary">Volver</a>
            <a th:href="@{/presupuestos/imprimir/{id}(id=${presupuesto.id})}" class="btn btn-info">Imprimir</a>
            <form th:action="@{/presupuestos/convertir/{id}(id=${presupuesto.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-warning" onclick="return confirm('Â¿Convertir a Pedido?');">A Pedido</button>
            </form>
        </div>
    </div>
    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
