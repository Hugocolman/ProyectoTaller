<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario de CategorÃ­a</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/theme.css}" rel="stylesheet">
    </head>
    <body>

        <!-- Navbar -->
        <div th:replace="navbar :: navbar"></div>

        <div class="container mt-5">
            <h2 th:text="${categoria != null ? 'Editar Categoria' : 'Nueva Categoria'}"></h2>    

            <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" id="nombre" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" id="descripcion" class="form-control" rows="3" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary" th:text="${categoria.id == null ? 'Guardar' : 'Actualizar'}">Guardar</button>
                <a th:href="@{/categorias}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>

        <div th:replace="footer :: footer"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
