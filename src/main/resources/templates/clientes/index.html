<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Clientes</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/theme.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="navbar :: navbar"></div>

        <div class="container mt-5">
            <h2 class="text-center text-primary">Lista de Clientes</h2>
            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Edad</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Dirección</th>
                        <th>Ciudad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td th:text="${cliente.nombre}"></td>
                        <td th:text="${cliente.apellido}"></td>
                        <td th:text="${cliente.edad}"></td>
                        <td th:text="${cliente.telefono}"></td>
                        <td th:text="${cliente.correo}"></td>
                        <td th:text="${cliente.direccion}"></td>
                        <td th:text="${cliente.ciudad != null ? cliente.ciudad.ciudad : ''}"></td>
                        <td>
                            <a th:href="@{/clientes/editar/{id_persona}(id_persona=${cliente.id_persona})}" class="btn btn-primary btn-sm">Editar</a>
                            <form th:action="@{/clientes/eliminar/{id_persona}(id_persona=${cliente.id_persona})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Â¿Eliminar este cliente?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <div class="text-center">
                <a th:href="@{/clientes/nuevo}" class="btn btn-success mt-3">Nuevo Cliente</a>
            </div>
        </div>

        <div th:replace="footer :: footer"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
