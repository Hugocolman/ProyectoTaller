<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${cliente.id_persona != 0} ? 'Editar Cliente' : 'Nuevo Cliente'">Cliente</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/theme.css}" rel="stylesheet">
    </head>

    <body>
        <div th:replace="navbar :: navbar"></div>

        <div class="container mt-5">
            <h2 class="text-center" th:text="${cliente.id_persona != 0} ? 'Editar Cliente' : 'Nuevo Cliente'"></h2>
            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" class="mt-4">
                <input type="hidden" th:field="*{id_persona}" />

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" id="nombre" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input type="text" th:field="*{apellido}" id="apellido" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="edad" class="form-label">Edad</label>
                        <input type="number" th:field="*{edad}" id="edad" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}" id="telefono" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="correo" class="form-label">Correo</label>
                        <input type="email" th:field="*{correo}" id="correo" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="direccion" class="form-label">Dirección</label>
                    <input type="text" th:field="*{direccion}" id="direccion" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <select id="ciudad" class="form-select" th:field="*{ciudad}" required>
                        <option value="" disabled th:selected="${cliente.ciudad == null}">Seleccione una ciudad</option>
                        <option th:each="ci : ${ciudades}" th:value="${ci.idCiudad}" th:text="${ci.ciudad}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary" th:text="${cliente.id_persona == 0} ? 'Guardar' : 'Actualizar'">Guardar</button>
                </div>
            </form>
        </div>

        <div th:replace="footer :: footer"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
