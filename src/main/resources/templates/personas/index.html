<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Personas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <!-- Navbar -->
        <div th:replace="navbar :: navbar"></div>

        <!-- Contenido principal -->
        <div class="container mt-5">
            <h2 class="text-center text-primary">Lista de Personas</h2>
            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Edad</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Dirección</th>
                        <th>Ciudad</th>
                        <th>País</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="persona : ${personas}">
                        <td th:text="${persona.nombre}"></td>
                        <td th:text="${persona.apellido}"></td>
                        <td th:text="${persona.edad}"></td>
                        <td th:text="${persona.telefono}"></td>
                        <td th:text="${persona.correo}"></td>
                        <td th:text="${persona.direccion}"></td>
                        <td th:text="${persona.ciudad.ciudad}"></td>
                        <td th:text="${persona.ciudad.idPais.paDes}"></td>
                        <td>
                            <a th:href="@{/personas/editar/{id_persona}(id_persona=${persona})}" class="btn btn-primary btn-sm">Editar</a>
                            <form th:action="@{/personas/eliminar/{id_persona}(id_persona=${persona})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta persona?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="text-center">
                <a th:href="@{/personas/nuevo}" class="btn btn-success mt-3">Nueva Persona</a>
            </div>
        </div>
        <!-- Footer -->
        <footer class="bg-light text-center mt-4 p-3 fixed-bottom" style="z-index:1030;">
            <p class="text-muted mb-0">&copy; 2024 - Proyecto de Hugo Colman. Todos los derechos reservados.</p>
        </footer>
        

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
