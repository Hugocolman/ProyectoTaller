<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="fragments/layout :: head('Agregar Persona')"></head>

    <body th:replace="fragments/layout :: shell(~{::section})">
        <section>

        <!-- Formulario -->
        <div class="container">
            <div class="form-container">
                <h2 class="text-center text-primary">Agregar Persona</h2>
                <form th:action="@{/personas/guardar}" method="post" th:object="${persona}">
                    <!-- ID Persona (oculto) -->
                    <input type="hidden" class="form-control" name="id_persona" th:field="*{id_persona}" />

                    <!-- Nombre y Apellido -->
                    <div class="mb-3">
                        <label for="txtnombre" class="form-label">Nombre</label>
                        <input type="text" id="txtnombre" class="form-control" th:field="*{nombre}" placeholder="Ingrese el nombre" required />
                    </div>
                    <div class="mb-3">
                        <label for="txtapellido" class="form-label">Apellido</label>
                        <input type="text" id="txtapellido" class="form-control" th:field="*{apellido}" placeholder="Ingrese el apellido" required />
                    </div>

                    <!-- Edad y Teléfono -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="txtedad" class="form-label">Edad</label>
                            <input type="number" id="txtedad" class="form-control" th:field="*{edad}" placeholder="Ingrese la edad" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="txttelefono" class="form-label">Teléfono</label>
                            <input type="text" id="txttelefono" class="form-control" th:field="*{telefono}" placeholder="Ingrese el Teléfono" required />
                        </div>
                    </div>

                    <!-- Correo y Dirección -->
                    <div class="mb-3">
                        <label for="txtcorreo" class="form-label">Correo</label>
                        <input type="email" id="txtcorreo" class="form-control" th:field="*{correo}" placeholder="Ingrese el correo electrÃ³nico" required />
                    </div>
                    <div class="mb-3">
                        <label for="txtdireccion" class="form-label">Dirección</label>
                        <input type="text" id="txtdireccion" class="form-control" th:field="*{direccion}" placeholder="Ingrese la Dirección" required />
                    </div>
                


                    <!-- Ciudad -->
                    <div class="mb-3">
                        <label for="ciudad" class="form-label">Ciudad</label>
                        <select id="ciudad" class="form-select" th:field="*{ciudad}" required>
                            <option value="" disabled selected>Seleccione una ciudad</option>
                            <option th:each="ciudad : ${ciudades}" th:value="${ciudad.idCiudad}" th:text="${ciudad.ciudad}">
                            </option>
                        </select>
                    </div>

                    <!-- Es cliente -->
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="esCliente" th:field="*{esCliente}">
                        <label class="form-check-label" for="esCliente">Es cliente</label>
                    </div>

                    <!-- Botones -->
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/personas}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>

        </section>
    </body>

</html>
