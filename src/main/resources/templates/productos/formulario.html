<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}">Formulario de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
            <div th:replace="navbar :: navbar"></div>

    
<div class="container mt-5">
    <h2 th:text="${producto.id == null ? 'Agregar Producto' : 'Editar Producto'}"></h2>
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" class="mt-4">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" id="nombre" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <input type="text" th:field="*{descripcion}" id="descripcion" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="precio" class="form-label">Precio</label>
            <input type="number" step="0.01" th:field="*{precio}" id="precio" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="cantidad" class="form-label">Cantidad</label>
            <input type="number" th:field="*{cantidad}" id="cantidad" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="ivaRate" class="form-label">IVA</label>
            <select th:field="*{ivaRate}" id="ivaRate" class="form-select">
                <option th:value="0.10">10%</option>
                <option th:value="0.05">5%</option>
                <option th:value="0.00">Exento</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" th:text="${producto.id == null ? 'Guardar' : 'Actualizar'}"></button>
        <a href="/productos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<div th:replace="footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
