<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head th:replace="fragments/layout :: head('Lista de Ciudades')"></head>

    <body th:replace="fragments/layout :: shell(~{::section})">
    <section>
        <!-- Reemplaza el encabezado desde tu plantilla -->
        <header th:replace="Plantillas/plantilla :: encabezado"></header>

        <div class="container mt-5">
            <h2 class="text-center">Lista de Ciudades</h2>

            <!-- Tabla de ciudades -->
            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>Ciudad</th>
                        <th>Estado</th>
                        <th>País</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Iterar sobre las ciudades con Thymeleaf -->

                    <tr th:each="ciudad : ${ciudades}">
                        <td class="text-center" th:text="${ciudad.ciudad}"></td>
                        <td class="text-center" th:text="${ciudad.ciuEs}"></td>
                        <td class="text-center" th:text="${ciudad.idPais.paDes}"></td>
                        <td>
                            <!-- Editar Ciudad: solo accesible para ADMIN -->
                            <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/ciudades/editar/{id}(id=${ciudad.idCiudad})}"
                               class="btn btn-warning btn-sm">Editar</a>

                            <!-- Eliminar Ciudad: solo accesible para ADMIN -->
                            <form sec:authorize="hasRole('ROLE_ADMIN')" th:action="@{/ciudades/eliminar/{id}(id=${ciudad.idCiudad})}"
                                  method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Â¿Eliminar esta ciudad?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Agregar nueva ciudad -->
            <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/ciudades/nuevo}" class="btn btn-success mt-3">Nueva Ciudad</a>
        </div>

        
    </section>
    </body>

</html>
