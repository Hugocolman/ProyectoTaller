<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Países</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/theme.css}" rel="stylesheet">
    </head>
    <body>

        <!-- Navbar -->
        <div th:replace="navbar :: navbar"></div>

        <div class="container mt-5">
            <h2 class="text-center">Lista de Países</h2>

            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre del País</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pais : ${paises}">
                        <td th:text="${pais.idPais}"></td>
                        <td th:text="${pais.paDes}"></td>
                        <td>
                            <!-- Enlace a la Página de ciudades del País -->

                            <a th:href="@{/paises/editar/{id}(id=${pais.idPais})}" class="btn btn-primary btn-sm">Editar</a>
                            <form th:action="@{/paises/eliminar/{id}(id=${pais.idPais})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Â¿Eliminar País?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <a th:href="@{/paises/nuevo}" class="btn btn-success mt-3">Nuevo País</a>
        </div>

        <div th:replace="footer :: footer"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
