<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pais.idPais != null} ? 'Editar País' : 'Nuevo País'">Gestión de Países</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<div th:replace="navbar :: navbar"></div>

<div class="container mt-5">
    <h2 class="text-center" th:text="${pais.idPais != null} ? 'Nuevo País' : 'Editar País'">Nuevo Pais</h2>

    <form th:action="@{/paises/guardar}" th:object="${pais}" method="post" class="mt-4">
        <input type="hidden" th:field="*{idPais}" />

        <div class="mb-3">
            <label for="paDes" class="form-label">Nombre del País</label>
            <input type="text" th:field="*{paDes}" id="paDes" class="form-control" placeholder="Ingrese el nombre del País" required>
        </div>

        <div class="d-flex justify-content-between">
            <button type="submit" class="btn btn-success" th:text="${pais.idPais == null ? 'Actualizar' : 'Guardar'}">Guardar</button>
            <a th:href="@{/paises}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>

<div th:replace="footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
