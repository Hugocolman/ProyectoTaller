<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${barrio.id != null} ? 'Editar Barrio' : 'Nuevo Barrio'">Nuevo Barrio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
   
    <!-- Navbar -->
<div th:replace="navbar :: navbar"></div>
    
    
<div class="container mt-5">
    <h2 th:text="${barrio.id != null} ? 'Editar Barrio' : 'Nuevo Barrio'"></h2>

    <form th:action="@{${barrio.id != null} ? '/barrios/actualizar' : '/barrios/guardar'}" th:object="${barrio}" method="post" class="bg-light p-4 rounded">
        <input type="hidden" th:field="*{id}" />
        
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" id="nombre" class="form-control" required>
        </div>

        

        <button type="submit" class="btn btn-primary" th:text="${barrio.id != null} ? 'Actualizar' : 'Guardar'">Guardar</button>
        <a th:href="@{/barrios}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<div th:replace="footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
