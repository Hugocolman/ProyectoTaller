<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Barrios</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/theme.css}" rel="stylesheet">
    </head>
    <body>

        <!-- Navbar -->
        <div th:replace="navbar :: navbar"></div>

        <div class="container mt-5">
            <h2 class="text-center">Lista de Barrios</h2>

            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>

                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="barrio : ${barrios}">
                        <td th:text="${barrio.id}"></td>
                        <td th:text="${barrio.nombre}"></td>

                        <td>
                            <a th:href="@{/barrios/editar/{id}(id=${barrio.id})}" class="btn btn-primary btn-sm">Editar</a>
                            <form th:action="@{/barrios/eliminar/{id}(id=${barrio.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar barrio?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>


            <a href="/barrios/nuevo" class="btn btn-success mt-3">Nuevo Barrio</a>
        </div>
        <div th:replace="footer :: footer"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
