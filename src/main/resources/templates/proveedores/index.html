<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/layout :: head('Lista de Proveedores')"></head>
    <body th:replace="fragments/layout :: shell(~{::section})">
        <section>

        <div class="container mt-5">
            <h2 class="text-center text-primary">Lista de Proveedores</h2>
            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Dirección</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="proveedor : ${proveedores}">
                        <td th:text="${proveedor.id}"></td>
                        <td th:text="${proveedor.nombre}"></td>
                        <td th:text="${proveedor.direccion}"></td>
                        <td th:text="${proveedor.telefono}"></td>
                        <td th:text="${proveedor.email}"></td>
                        <td>
                            <a th:href="@{/proveedores/editar/{id}(id=${proveedor.id})}" class="btn btn-primary btn-sm">Editar</a>
                            <form th:action="@{/proveedores/eliminar/{id}(id=${proveedor.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar este Proveedor?');">Eliminar</button>
                            </form>          
                        </td>
                    </tr>
                </tbody>
            </table>
            <a href="/proveedores/nuevo" class="btn btn-success mt-3">Nuevo Proveedor</a>
        </div>
        
        </section>
    </body>
</html>
