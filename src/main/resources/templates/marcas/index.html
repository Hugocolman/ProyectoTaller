<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="fragments/layout :: head('Lista de Marcas')"></head>
    <body th:replace="fragments/layout :: shell(~{::section})">
        <section>

        <div class="container mt-5">
            <h2 class="text-center text-primary">Lista de Marcas</h2>
            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>País de Origen</th>
                        <th>Año de Fundación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="marca : ${marcas}">
                        <td th:text="${marca.id}"></td>
                        <td th:text="${marca.nombre}"></td>
                        <td th:text="${marca.paisOrigen}"></td>
                        <td th:text="${marca.anoFundacion}"></td>
                        <td>
                            <a th:href="@{/marcas/editar/{id}(id=${marca.id})}" class="btn btn-primary btn-sm">Editar</a>
                            <form th:action="@{/marcas/eliminar/{id}(id=${marca.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar este país?');">Eliminar</button>
                            </form>                       
                        </td>
                    </tr>
                </tbody>
            </table>
            <a th:href="@{/marcas/nuevo}" class="btn btn-success mt-3">Nueva Marca</a>
        </div>

        </section>
    </body>
</html>
