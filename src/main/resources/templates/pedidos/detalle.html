<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container mt-4">
        <h2>Detalle de Pedido</h2>
        <div class="mb-3">
            <strong>Cliente:</strong> <span th:text="${pedido.cliente}"></span><br>
            <strong>Fecha:</strong> <span th:text="${pedido.fecha != null ? pedido.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></span><br>
            <strong>Estado:</strong> <span th:text="${pedido.estado}"></span><br>
        </div>
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Entregado</th>
                    <th>Pendiente</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="det : ${pedido.detalles}">
                    <td th:text="${det.producto != null ? det.producto.nombre : ''}"></td>
                    <td th:text="${det.cantidad}"></td>
                    <td th:text="${det.precioUnitario}"></td>
                    <td th:text="${entregadoMap[det.producto.id] != null ? entregadoMap[det.producto.id] : 0}"></td>
                    <td th:text="${det.cantidad - (entregadoMap[det.producto.id] != null ? entregadoMap[det.producto.id] : 0)}"></td>
                    <td th:text="${det.cantidad * det.precioUnitario}"></td>
                </tr>
            </tbody>
        </table>
        <div class="text-end">
            <strong>Total: </strong><span th:text="${pedido.total}"></span>
        </div>
        <div class="mt-3">
            <a th:href="@{/pedidos}" class="btn btn-secondary">Volver</a>
            <a th:href="@{/pedidos/imprimir/{id}(id=${pedido.id})}" class="btn btn-info">Imprimir</a>
        </div>
    </div>
    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
