<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">
    <div th:replace="navbar :: navbar"></div>
    <main class="flex-grow-1">
    <div class="container mt-4">
        <h2 class="text-center">Pedido</h2>
        <form th:action="@{/pedidos/guardar}" th:object="${pedido}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Cliente</label>
                    <input type="text" class="form-control" th:field="*{cliente}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" th:field="*{fecha}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Estado</label>
                    <select class="form-select" th:field="*{estado}">
                        <option value="PENDIENTE">PENDIENTE</option>
                        <option value="COMPLETADO">COMPLETADO</option>
                        <option value="CANCELADO">CANCELADO</option>
                    </select>
                </div>
            </div>
            <h5 class="mt-4">Items</h5>
            <table class="table table-bordered align-middle" id="tabla-items">
                <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio Unitario</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="items-body">
                    <tr th:each="det, iter : *{detalles}">
                        <td>
                            <select class="form-select" th:field="*{detalles[__${iter.index}__].producto.id}" required>
                                <option value="" disabled selected>Seleccione</option>
                                <option th:each="prod : ${productos}" th:value="${prod.id}" th:text="${prod.nombre}"></option>
                            </select>
                        </td>
                        <td><input type="number" min="1" class="form-control" th:field="*{detalles[__${iter.index}__].cantidad}" required></td>
                        <td><input type="number" min="0" step="0.01" class="form-control" th:field="*{detalles[__${iter.index}__].precioUnitario}"></td>
                        <td><input type="number" min="0" step="0.01" class="form-control subtotal" readonly></td>
                        <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">Eliminar</button></td>
                    </tr>
                </tbody>
            </table>
            <button type="button" class="btn btn-secondary mb-3" onclick="agregarFila()">Agregar Items</button>
            <div class="row mb-3">
                <div class="col-md-4 offset-md-8">
                    <label class="form-label fw-bold">Total:</label>
                    <input type="number" class="form-control" id="total" th:field="*{total}" readonly>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
    </main>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var productos = [[${productos}]];
        function getProductosOptions() {
            let html = '<option value="" disabled selected>Seleccione</option>';
            productos.forEach(function(prod) { html += `<option value="${prod.id}">${prod.nombre}</option>`; });
            return html;
        }
        function agregarFila() {
            const tabla = document.getElementById('items-body');
            const rowCount = tabla.rows.length;
            const row = tabla.insertRow();
            row.innerHTML = `
                <td>
                    <select class="form-select" name="detalles[${rowCount}].producto.id" required>
                        ${getProductosOptions()}
                    </select>
                </td>
                <td><input type="number" min="1" class="form-control" name="detalles[${rowCount}].cantidad" required></td>
                <td><input type="number" min="0" step="0.01" class="form-control" name="detalles[${rowCount}].precioUnitario"></td>
                <td><input type="number" min="0" step="0.01" class="form-control subtotal" readonly></td>
                <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">Eliminar</button></td>
            `;
        }
        function eliminarFila(btn) { btn.closest('tr').remove(); calcularTotal(); }
        function calcularTotal() {
            let total = 0;
            document.querySelectorAll('#items-body tr').forEach(function(row){
                const cant = parseFloat(row.querySelector('input[name$=".cantidad"]').value) || 0;
                const costo = parseFloat(row.querySelector('input[name$=".precioUnitario"]').value) || 0;
                const sub = cant * costo;
                row.querySelector('.subtotal').value = sub.toFixed(2);
                total += sub;
            });
            document.getElementById('total').value = total.toFixed(2);
        }
        document.addEventListener('input', function(e){
            if (e.target && e.target.name && (e.target.name.includes('.cantidad') || e.target.name.includes('.precioUnitario'))) {
                calcularTotal();
            }
        });
        /*]]>*/
    </script>

    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
