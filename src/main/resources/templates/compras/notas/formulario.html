<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Nueva Nota de Compra')"></head>
<body th:replace="fragments/layout :: shell(~{::section})">
<section>
<div class="container mt-4">
  <h1 class="h4">Registrar Nota de Compra</h1>
  <form th:action="@{/compras/notas/guardar}" method="post">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Compra</label>
        <select class="form-select" name="compra.id" required>
          <option value="" disabled th:selected="${nota.compra == null}">Selecciona compra</option>
          <option th:each="c: ${compras}"
                  th:value="${c.id}"
                  th:text="${#temporals.format(c.fecha, 'yyyy-MM-dd')} + ' - ' + (c.proveedor != null ? c.proveedor.nombre : '')"
                  th:selected="${nota.compra != null and c.id == nota.compra.id}"></option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" name="tipo" required>
          <option value="CREDITO" th:selected="${nota.tipo == 'CREDITO'}">Crédito</option>
          <option value="DEBITO" th:selected="${nota.tipo == 'DEBITO'}">Débito</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Monto</label>
        <input type="number" step="0.01" class="form-control" name="monto" th:value="${nota.monto}" required>
      </div>
      <div class="col-12">
        <label class="form-label">Motivo</label>
        <input type="text" class="form-control" name="motivo" th:value="${nota.motivo}">
      </div>
      <div class="col-12">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="afectaStock" id="afectaStock" th:checked="${nota.afectaStock}">
          <label class="form-check-label" for="afectaStock">Afecta stock</label>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Producto (opcional)</label>
        <select class="form-select" name="producto.id">
          <option value="" th:selected="${nota.producto == null}">-- Ninguno --</option>
          <option th:each="p: ${productos}" th:value="${p.id}" th:text="${p.nombre}"
                  th:selected="${nota.producto != null and p.id == nota.producto.id}"></option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Cantidad</label>
        <input type="number" min="0" class="form-control" name="cantidad" th:value="${nota.cantidad}">
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a th:href="@{/compras/notas}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
  </div>
</section>
</body>
</html>
