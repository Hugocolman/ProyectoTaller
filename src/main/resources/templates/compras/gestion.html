<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Compras - Gestionar Compras')"></head>
<body th:replace="fragments/layout :: shell(~{::section})">
<section>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Gestionar Compras</h1>
    <a th:href="@{/compras}" class="btn btn-secondary btn-sm">Volver</a>
  </div>
  <form class="row g-2 mb-3">
    <div class="col-auto"><input class="form-control" type="search" name="q" th:value="${q}" placeholder="Buscar por proveedor"></div>
    <div class="col-auto"><input type="date" class="form-control" name="desde" th:value="${desde}"></div>
    <div class="col-auto"><input type="date" class="form-control" name="hasta" th:value="${hasta}"></div>
    <div class="col-auto"><button class="btn btn-outline-secondary" type="submit">Filtrar</button></div>
  </form>
  <div class="table-responsive">
    <table class="table table-sm table-striped align-middle">
      <thead>
      <tr><th>#</th><th>Fecha</th><th>Proveedor</th><th>Método Pago</th><th>Nro Factura</th><th>Estado</th><th>Total</th><th></th></tr>
      </thead>
      <tbody>
      <tr th:each="c : ${compras}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.fecha}"></td>
        <td th:text="${c.proveedor != null ? c.proveedor.nombre : '—'}"></td>
        <td th:text="${c.metodoPago}"></td>
        <td th:text="${c.nroFactura}"></td>
        <td th:text="${c.estado}"></td>
        <td th:text="${c.total}"></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" th:href="@{'/compras/gestion/detalle/' + ${c.id}}">Detalle</a>
          <form th:if="${c.estado != 'ANULADA'}" th:action="@{'/compras/gestion/anular/' + ${c.id}}" method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('¿Anular esta compra?');">Anular</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</section>
</body>
</html>
