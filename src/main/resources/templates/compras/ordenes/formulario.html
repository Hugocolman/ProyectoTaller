<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Orden de Compra')"></head>
<body th:replace="fragments/layout :: shell(~{::section})">
<section>
<div class="container mt-4">
  <h1 class="h4" th:text="${orden.id} != null ? 'Editar Orden' : 'Nueva Orden'"></h1>
  <form th:action="@{/compras/ordenes/guardar}" th:object="${orden}" method="post">
    <div th:replace="fragments/messages :: formMessages"></div>
    <input type="hidden" th:field="*{id}">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Fecha</label>
        <input type="date" class="form-control" th:field="*{fecha}" th:classappend="${#fields.hasErrors('fecha')}? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Número</label>
        <input type="text" class="form-control" th:field="*{numero}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Estado</label>
        <input type="text" class="form-control" th:field="*{estado}" readonly>
      </div>
      <div class="col-md-6">
        <label class="form-label">Proveedor</label>
        <select class="form-select" th:field="*{proveedor.id}" th:classappend="${#fields.hasErrors('proveedor')}? 'is-invalid'" required>
          <option value="" disabled th:selected="${orden.proveedor == null}">Selecciona un proveedor</option>
          <option th:each="prov: ${proveedores}"
                  th:value="${prov.id}"
                  th:text="${prov.nombre}"
                  th:selected="${orden.proveedor != null and prov.id == orden.proveedor.id}">
          </option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('proveedor')}" th:errors="*{proveedor}"></div>
      </div>
      <div class="col-md-6">
        <label class="form-label">Total</label>
        <input type="number" step="0.01" class="form-control" th:field="*{total}" th:classappend="${#fields.hasErrors('total')}? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('total')}" th:errors="*{total}"></div>
      </div>
    </div>
    <div class="mt-4">
      <h5>Detalles</h5>
      <div class="table-responsive">
        <table class="table table-sm align-middle" id="tabla-detalles">
          <thead>
          <tr><th>Producto</th><th style="width:120px;">Cantidad</th><th style="width:160px;">Costo Unit.</th><th style="width:60px;"></th></tr>
          </thead>
          <tbody>
          <tr th:if="${orden.detalles == null or #lists.isEmpty(orden.detalles)}">
            <td>
              <select class="form-select" name="itemProductoId">
                <option th:each="prod: ${productos}" th:value="${prod.id}" th:text="${prod.nombre}"></option>
              </select>
            </td>
            <td><input type="number" class="form-control" name="itemCantidad" min="1" value="1"></td>
            <td><input type="number" class="form-control" name="itemCosto" step="0.01" value="0.00"></td>
            <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarFila(this)">-</button></td>
          </tr>
          <tr th:each="d, idx : ${orden.detalles}">
            <td>
              <select class="form-select" name="itemProductoId">
                <option th:each="prod: ${productos}"
                        th:value="${prod.id}"
                        th:text="${prod.nombre}"
                        th:selected="${d.producto != null and prod.id == d.producto.id}"></option>
              </select>
            </td>
            <td><input type="number" class="form-control" name="itemCantidad" min="1" th:value="${d.cantidad}"></td>
            <td><input type="number" class="form-control" name="itemCosto" step="0.01" th:value="${d.costoUnitario}"></td>
            <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarFila(this)">-</button></td>
          </tr>
          </tbody>
        </table>
      </div>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarFila()">Agregar línea</button>
    </div>

    <div class="mt-4">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a th:href="@{/compras/ordenes}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
  <p class="text-muted mt-3">Nota: la gestión de detalles se agregará en una iteración posterior.</p>
  </div>
</section>
<script>
  function agregarFila(){
    const tbody = document.querySelector('#tabla-detalles tbody');
    const tr = tbody.rows[0].cloneNode(true);
    tr.querySelectorAll('input').forEach(inp=>{ if(inp.name==='itemCantidad'){inp.value=1;} if(inp.name==='itemCosto'){inp.value='0.00';}});
    tbody.appendChild(tr);
  }
  function eliminarFila(btn){
    const tbody = document.querySelector('#tabla-detalles tbody');
    if (tbody.rows.length>1){ btn.closest('tr').remove(); }
  }
</script>
</body>
</html>
