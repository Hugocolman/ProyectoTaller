<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Compras</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/theme.css}" rel="stylesheet">
    </head>
    <body>
        <div th:replace="navbar :: navbar"></div>

        <div class="container mt-5">
            <h2 class="text-center">Lista de Compras</h2>

            <form class="row g-2 my-3" method="get" th:action="@{/compras}">
                <div class="col-sm-4 col-md-3">
                    <input class="form-control" type="text" name="factura" placeholder="Nro Factura" th:value="${factura}">
                </div>
                <div class="col-sm-6 col-md-4">
                    <input class="form-control" type="text" name="prov" placeholder="Proveedor" th:value="${prov}">
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary" type="submit">Filtrar</button>
                </div>
            </form>
            <table class="table table-striped table-bordered mt-4">
                <thead class="table-primary">
                    <tr>
                        <th>Fecha</th>
                        <th>Proveedor</th>
                        <th>Nro Factura</th>
                        <th>Método</th>
                        <th>Estado</th>
                        <th>Total</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="compra : ${page.content}">
                        <td th:text="${compra.fecha != null ? compra.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></td>
                        <td th:text="${compra.proveedor != null ? compra.proveedor.nombre : ''}"></td>
                        <td th:text="${compra.nroFactura}"></td>
                        <td th:text="${compra.metodoPago}"></td>
                        <td>
                            <span th:text="${compra.estado}" th:classappend="${compra.estado == 'ANULADA'} ? 'badge bg-secondary' : 'badge bg-dark'"></span>
                        </td>
                        <td th:text="${compra.total}"></td>
                        <td>
                            <a th:href="@{/compras/editar/{id}(id=${compra.id})}" class="btn btn-primary btn-sm" th:classappend="${compra.estado == 'ANULADA'} ? ' disabled'">Editar</a>
                            <a th:href="@{/compras/detalle/{id}(id=${compra.id})}" class="btn btn-secondary btn-sm">Detalle</a>
                            <a th:href="@{/compras/imprimir/{id}(id=${compra.id})}" class="btn btn-info btn-sm">Imprimir</a>
                            <form th:if="${compra.estado != 'ANULADA'}" th:action="@{/compras/anular/{id}(id=${compra.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-warning btn-sm" onclick="return confirm('Â¿Anular compra? Esto revierte el stock.')">Anular</button>
                            </form>
                            <form th:action="@{/compras/eliminar/{id}(id=${compra.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Â¿Eliminar compra?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <nav aria-label="Paginación">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${page.first}? 'disabled'">
                        <a class="page-link" th:href="@{/compras(page=${page.number-1},size=${page.size},factura=${factura},prov=${prov})}">Anterior</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages-1)}" th:classappend="${i == page.number}? 'active'">
                        <a class="page-link" th:text="${i+1}" th:href="@{/compras(page=${i},size=${page.size},factura=${factura},prov=${prov})}"></a>
                    </li>
                    <li class="page-item" th:classappend="${page.last}? 'disabled'">
                        <a class="page-link" th:href="@{/compras(page=${page.number+1},size=${page.size},factura=${factura},prov=${prov})}">Siguiente</a>
                    </li>
                </ul>
            </nav>
            <div class="text-center">
                <a th:href="@{/compras/nuevo}" class="btn btn-success mt-3">Nueva Compra</a>
            </div>
        </div>

        <div th:replace="footer :: footer"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
