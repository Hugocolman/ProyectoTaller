<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra - Imprimir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Compra</h2>
            <button class="btn btn-primary no-print" onclick="window.print()">Imprimir</button>
        </div>
        <div class="mb-3">
            <strong>Proveedor:</strong> <span th:text="${compra.proveedor != null ? compra.proveedor.nombre : ''}"></span><br>
            <strong>Fecha:</strong> <span th:text="${compra.fecha != null ? compra.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></span><br>
            <strong>Método:</strong> <span th:text="${compra.metodoPago}"></span><br>
            <strong>Nro Factura:</strong> <span th:text="${compra.nroFactura}"></span>
        </div>
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Costo Unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="det : ${compra.detalles}">
                    <td th:text="${det.producto != null ? det.producto.nombre : ''}"></td>
                    <td th:text="${det.cantidad}"></td>
                    <td th:text="${det.costoUnitario}"></td>
                    <td th:text="${det.cantidad * det.costoUnitario}"></td>
                </tr>
            </tbody>
        </table>
        <div class="text-end">
            <strong>Total: </strong><span th:text="${compra.total}"></span>
        </div>
        <div class="no-print mt-3">
            <a th:href="@{/compras}" class="btn btn-secondary">Volver</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
