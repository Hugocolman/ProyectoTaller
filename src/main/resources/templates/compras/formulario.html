<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">
    <div th:replace="navbar :: navbar"></div>

    <main class="flex-grow-1">
    <div class="container mt-4">
        <h2 class="text-center">Formulario de Compra</h2>
        <form th:action="@{/compras/guardar}" th:object="${compra}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row mb-3">
                <div class="col-md-5">
                    <label for="proveedor" class="form-label">Proveedor</label>
                    <select class="form-select" id="proveedor" th:field="*{proveedor.id}" required>
                        <option value="" disabled selected>Seleccione un proveedor</option>
                        <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.nombre}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="fecha" class="form-label">Fecha</label>
                    <input type="date" class="form-control" id="fecha" th:field="*{fecha}" required>
                </div>
                <div class="col-md-2">
                    <label for="metodoPago" class="form-label">Método</label>
                    <select class="form-select" id="metodoPago" th:field="*{metodoPago}" required>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Tarjeta">Tarjeta</option>
                        <option value="Transferencia">Transferencia</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="nroFactura" class="form-label">Nro Factura</label>
                    <input type="text" class="form-control" id="nroFactura" th:field="*{nroFactura}">
                </div>
            </div>

            <div class="mb-3">
                <label for="observacion" class="form-label">ObservaciÃ³n</label>
                <textarea class="form-control" id="observacion" th:field="*{observacion}" rows="2"></textarea>
            </div>

            <h5 class="mt-4">Productos</h5>
            <table class="table table-bordered align-middle" id="tabla-productos">
                <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Costo Unitario</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="productos-body">
                    <tr th:each="detalle, iter : *{detalles}">
                        <td>
                            <select class="form-select" th:field="*{detalles[__${iter.index}__].producto.id}" required>
                                <option value="" disabled selected>Seleccione</option>
                                <option th:each="prod : ${productos}" th:value="${prod.id}" th:text="${prod.nombre}"></option>
                            </select>
                        </td>
                        <td><input type="number" min="1" class="form-control" th:field="*{detalles[__${iter.index}__].cantidad}" required></td>
                        <td><input type="number" min="0" step="0.01" class="form-control" th:field="*{detalles[__${iter.index}__].costoUnitario}"></td>
                        <td><input type="number" min="0" step="0.01" class="form-control subtotal" readonly></td>
                        <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">Eliminar</button></td>
                    </tr>
                </tbody>
            </table>
            <button type="button" class="btn btn-secondary mb-3" onclick="agregarFila()">Agregar Producto</button>

            <div class="row mb-3">
                <div class="col-md-4 offset-md-8">
                    <label class="form-label fw-bold">Total:</label>
                    <input type="number" class="form-control" id="total" th:field="*{total}" readonly>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Guardar Compra</button>
                <a th:href="@{/compras}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
    </main>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var productos = [[${productos}]];
        function getProductosOptions() {
            let html = '<option value="" disabled selected>Seleccione</option>';
            productos.forEach(function(prod) {
                html += `<option value="${prod.id}">${prod.nombre}</option>`;
            });
            return html;
        }
        function agregarFila() {
            const tabla = document.getElementById('productos-body');
            const rowCount = tabla.rows.length;
            const row = tabla.insertRow();
            row.innerHTML = `
                <td>
                    <select class="form-select" name="detalles[${rowCount}].producto.id" required>
                        ${getProductosOptions()}
                    </select>
                </td>
                <td><input type="number" min="1" class="form-control" name="detalles[${rowCount}].cantidad" required></td>
                <td><input type="number" min="0" step="0.01" class="form-control" name="detalles[${rowCount}].costoUnitario"></td>
                <td><input type="number" min="0" step="0.01" class="form-control subtotal" readonly></td>
                <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">Eliminar</button></td>
            `;
        }
        function eliminarFila(btn) { btn.closest('tr').remove(); calcularTotal(); }
        function calcularTotal() {
            let total = 0;
            document.querySelectorAll('#productos-body tr').forEach(function(row){
                const cant = parseFloat(row.querySelector('input[name$=".cantidad"]').value) || 0;
                const costo = parseFloat(row.querySelector('input[name$=".costoUnitario"]').value) || 0;
                const sub = cant * costo;
                row.querySelector('.subtotal').value = sub.toFixed(2);
                total += sub;
            });
            document.getElementById('total').value = total.toFixed(2);
        }
        document.addEventListener('input', function(e){
            if (e.target && e.target.name && (e.target.name.includes('.cantidad') || e.target.name.includes('.costoUnitario'))) {
                calcularTotal();
            }
        });
        /*]]>*/
    </script>

    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
