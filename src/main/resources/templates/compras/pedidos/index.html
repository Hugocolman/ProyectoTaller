<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Pedidos a Proveedor')"></head>
<body th:replace="fragments/layout :: shell(~{::section})">
<section>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Pedidos a Proveedor</h1>
    <a class="btn btn-primary" th:href="@{/compras/pedidos/nuevo}">Nuevo Pedido</a>
  </div>
  <form class="row g-2 mb-3">
    <div class="col-auto">
      <input class="form-control" type="search" name="q" th:value="${q}" placeholder="Buscar por proveedor o número">
    </div>
    <div class="col-auto"><button class="btn btn-outline-secondary" type="submit">Buscar</button></div>
  </form>
  <div class="table-responsive">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <table class="table table-sm table-striped align-middle">
      <thead>
      <tr><th>#</th><th>Fecha</th><th>Número</th><th>Proveedor</th><th>Estado</th><th>Total</th><th></th></tr>
      </thead>
      <tbody>
      <tr th:each="p: ${pedidos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.fecha}"></td>
        <td th:text="${p.numero}"></td>
        <td th:text="${p.proveedor != null ? p.proveedor.nombre : '—'}"></td>
        <td th:text="${p.estado}"></td>
        <td th:text="${p.total}"></td>
        <td class="text-end">
          <form th:action="@{'/compras/pedidos/convertir/' + ${p.id}}" method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-success" type="submit">Convertir a OC</button>
          </form>
          <a class="btn btn-sm btn-outline-primary" th:href="@{'/compras/pedidos/editar/' + ${p.id}}">Editar</a>
          <form th:action="@{'/compras/pedidos/eliminar/' + ${p.id}}" method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
          </form>
          <form th:if="${p.estado == 'PENDIENTE'}" th:action="@{'/compras/pedidos/autorizar/' + ${p.id}}" method="post" class="d-inline">
            <button class="btn btn-sm btn-primary" type="submit">Autorizar</button>
          </form>
          <form th:if="${p.estado == 'AUTORIZADO'}" th:action="@{'/compras/pedidos/desautorizar/' + ${p.id}}" method="post" class="d-inline">
            <button class="btn btn-sm btn-warning" type="submit">Desautorizar</button>
          </form>
          <form th:if="${p.estado == 'PENDIENTE'}" th:action="@{'/compras/pedidos/anular/' + ${p.id}}" method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('¿Anular pedido?');">Anular</button>
          </form>
          <a class="btn btn-sm btn-outline-secondary" th:href="@{'/compras/pedidos/detalle/' + ${p.id}}">Reporte</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <a th:href="@{/compras}" class="btn btn-secondary btn-sm">Volver</a>
  </div>
</section>
</body>
</html>
