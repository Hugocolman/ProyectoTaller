<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Reporte de Pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/theme.css}" rel="stylesheet">
  <style>@media print { .no-print { display:none; } }</style>
  </head>
<body>
<div th:replace="navbar :: navbar"></div>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Pedido a Proveedor</h2>
    <div class="no-print">
      <a th:href="@{/compras/pedidos}" class="btn btn-secondary">Volver</a>
      <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
    </div>
  </div>
  <div class="mb-3">
    <strong>Proveedor:</strong> <span th:text="${pedido.proveedor != null ? pedido.proveedor.nombre : ''}"></span><br>
    <strong>Fecha:</strong> <span th:text="${pedido.fecha}"></span><br>
    <strong>Estado:</strong> <span th:text="${pedido.estado}"></span>
  </div>
  <table class="table table-bordered">
    <thead class="table-light">
      <tr><th>Producto</th><th>Cantidad</th><th>Costo Unitario</th><th>Subtotal</th></tr>
    </thead>
    <tbody>
      <tr th:each="d : ${pedido.detalles}">
        <td th:text="${d.producto != null ? d.producto.nombre : ''}"></td>
        <td th:text="${d.cantidad}"></td>
        <td th:text="${d.costoUnitario}"></td>
        <td th:text="${d.costoUnitario.multiply(new java.math.BigDecimal(d.cantidad))}"></td>
      </tr>
    </tbody>
  </table>
  <div class="text-end">
    <strong>Total: </strong><span th:text="${pedido.total}"></span>
  </div>
</div>
<div th:replace="footer :: footer"></div>
</body>
</html>
