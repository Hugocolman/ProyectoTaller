<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container mt-4">
        <h2>Detalle de Compra</h2>
        <div class="mb-3">
            <strong>Proveedor:</strong> <span th:text="${compra.proveedor != null ? compra.proveedor.nombre : ''}"></span><br>
            <strong>Fecha:</strong> <span th:text="${compra.fecha != null ? compra.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></span><br>
            <strong>Método:</strong> <span th:text="${compra.metodoPago}"></span><br>
            <strong>Nro Factura:</strong> <span th:text="${compra.nroFactura}"></span><br>
            <strong>Estado:</strong> <span th:text="${compra.estado}"></span><br>
            <strong>ObservaciÃ³n:</strong> <span th:text="${compra.observacion}"></span>
        </div>
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Costo Unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="det : ${compra.detalles}">
                    <td th:text="${det.producto != null ? det.producto.nombre : ''}"></td>
                    <td th:text="${det.cantidad}"></td>
                    <td th:text="${det.costoUnitario}"></td>
                    <td th:text="${det.cantidad * det.costoUnitario}"></td>
                </tr>
            </tbody>
        </table>
        <div class="text-end">
            <strong>Total: </strong><span th:text="${compra.total}"></span>
        </div>
        <div class="mt-3">
            <a th:href="@{/compras}" class="btn btn-secondary">Volver</a>
            <a th:href="@{/compras/imprimir/{id}(id=${compra.id})}" class="btn btn-info">Imprimir</a>
            <form th:if="${compra.estado != 'ANULADA'}" th:action="@{/compras/anular/{id}(id=${compra.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-warning" onclick="return confirm('Â¿Anular compra? Esto revierte el stock.')">Anular</button>
            </form>
        </div>
    </div>
    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
