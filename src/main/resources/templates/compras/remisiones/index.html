<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Remisiones de Proveedor')"></head>
<body th:replace="fragments/layout :: shell(~{::section})">
<section>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Remisiones de Proveedor</h1>
    <a class="btn btn-primary" th:href="@{/compras/remisiones/nuevo}">Nueva Remisión</a>
  </div>
  <form class="row g-2 mb-3">
    <div class="col-auto"><input class="form-control" type="search" name="q" th:value="${q}" placeholder="Buscar por proveedor"></div>
    <div class="col-auto"><input type="date" class="form-control" name="desde" th:value="${desde}"></div>
    <div class="col-auto"><input type="date" class="form-control" name="hasta" th:value="${hasta}"></div>
    <div class="col-auto"><button class="btn btn-outline-secondary">Filtrar</button></div>
  </form>
  <div class="table-responsive">
    <table class="table table-sm table-striped align-middle">
      <thead>
      <tr><th>#</th><th>Fecha</th><th>Número</th><th>Proveedor</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody>
      <tr th:each="r: ${remisiones}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.fecha}"></td>
        <td th:text="${r.numero}"></td>
        <td th:text="${r.proveedor != null ? r.proveedor.nombre : ''}"></td>
        <td th:text="${r.estado}"></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" th:href="@{'/compras/remisiones/detalle/' + ${r.id}}">Detalle</a>
          <form th:if="${r.estado != 'ANULADA'}" th:action="@{'/compras/remisiones/anular/' + ${r.id}}" method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Anular remisión?');">Anular</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  </div>
</section>
</body>
</html>
