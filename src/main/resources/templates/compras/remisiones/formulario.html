<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Nueva Remisión de Proveedor')"></head>
<body th:replace="fragments/layout :: shell(~{::section})">
<section>
<div class="container mt-4">
  <h1 class="h4">Registrar Remisión de Proveedor</h1>
  <form th:action="@{/compras/remisiones/guardar}" th:object="${remision}" method="post">
    <div th:replace="fragments/messages :: formMessages"></div>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Fecha</label>
        <input type="date" class="form-control" th:field="*{fecha}" th:classappend="${#fields.hasErrors('fecha')}? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Número</label>
        <input type="text" class="form-control" th:field="*{numero}">
      </div>
      <div class="col-md-4">
        <label class="form-label">Proveedor</label>
        <select class="form-select" th:field="*{proveedor.id}" th:classappend="${#fields.hasErrors('proveedor')}? 'is-invalid'" required>
          <option value="" disabled th:selected="${remision.proveedor == null}">Selecciona un proveedor</option>
          <option th:each="prov: ${proveedores}" th:value="${prov.id}" th:text="${prov.nombre}" th:selected="${remision.proveedor != null and prov.id == remision.proveedor.id}"></option>
        </select>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('proveedor')}" th:errors="*{proveedor}"></div>
      </div>
      <div class="col-12">
        <label class="form-label">Observación</label>
        <input type="text" class="form-control" th:field="*{observacion}">
      </div>
    </div>
    <div class="mt-4">
      <h5>Detalles</h5>
      <div class="table-responsive">
        <table class="table table-sm align-middle" id="tabla-detalles">
          <thead>
          <tr><th>Producto</th><th style="width:120px;">Cantidad</th><th style="width:160px;">Costo Unit.</th><th style="width:60px;"></th></tr>
          </thead>
          <tbody>
          <tr>
            <td>
              <select class="form-select" name="itemProductoId">
                <option th:each="prod: ${productos}" th:value="${prod.id}" th:text="${prod.nombre}"></option>
              </select>
            </td>
            <td><input type="number" class="form-control" name="itemCantidad" min="1" value="1"></td>
            <td><input type="number" class="form-control" name="itemCosto" step="0.01" value="0.00"></td>
            <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="eliminarFila(this)">-</button></td>
          </tr>
          </tbody>
        </table>
      </div>
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarFila()">Agregar línea</button>
    </div>

    <div class="mt-4">
      <button class="btn btn-primary" type="submit">Guardar</button>
      <a th:href="@{/compras/remisiones}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
  </div>
</section>
<script>
  function agregarFila(){
    const tbody = document.querySelector('#tabla-detalles tbody');
    const tr = tbody.rows[0].cloneNode(true);
    tr.querySelectorAll('input').forEach(inp=>{ if(inp.name==='itemCantidad'){inp.value=1;} if(inp.name==='itemCosto'){inp.value='0.00';}});
    tbody.appendChild(tr);
  }
  function eliminarFila(btn){
    const tbody = document.querySelector('#tabla-detalles tbody');
    if (tbody.rows.length>1){ btn.closest('tr').remove(); }
  }
</script>
</body>
</html>
