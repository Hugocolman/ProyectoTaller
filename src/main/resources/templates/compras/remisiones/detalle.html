<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Detalle de Remisión')"></head>
<body th:replace="fragments/layout :: shell(~{::section})">
<section>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Detalle de Remisión</h1>
    <a th:href="@{/compras/remisiones}" class="btn btn-secondary btn-sm">Volver</a>
  </div>
  <div class="row mb-3">
    <div class="col-md-3"><strong>ID:</strong> <span th:text="${remision.id}"></span></div>
    <div class="col-md-3"><strong>Fecha:</strong> <span th:text="${remision.fecha}"></span></div>
    <div class="col-md-6"><strong>Proveedor:</strong> <span th:text="${remision.proveedor != null ? remision.proveedor.nombre : ''}"></span></div>
    <div class="col-md-3"><strong>Estado:</strong> <span class="badge bg-secondary" th:text="${remision.estado}"></span></div>
    <div class="col-md-9"><strong>Observación:</strong> <span th:text="${remision.observacion}"></span></div>
  </div>
  <div class="table-responsive">
    <table class="table table-sm table-striped align-middle">
      <thead>
      <tr><th>Producto</th><th>Cantidad</th><th>Costo Unitario</th></tr>
      </thead>
      <tbody>
      <tr th:each="d : ${remision.detalles}">
        <td th:text="${d.producto != null ? d.producto.nombre : '—'}"></td>
        <td th:text="${d.cantidad}"></td>
        <td th:text="${d.costoUnitario}"></td>
      </tr>
      </tbody>
    </table>
  </div>
  <div class="mt-2">
    <form th:if="${remision.estado != 'ANULADA'}" th:action="@{'/compras/remisiones/anular/' + ${remision.id}}" method="post">
      <button class="btn btn-outline-danger" onclick="return confirm('¿Anular esta remisión?');">Anular Remisión</button>
    </form>
  </div>
</div>
</section>
</body>
</html>
