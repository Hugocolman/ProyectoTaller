<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container mt-4">
        <h2>Detalle de Factura</h2>
        <div class="mb-3">
            <strong>Número:</strong> <span th:text="${factura.numero}"></span><br>
            <strong>Cliente:</strong> <span th:text="${factura.cliente}"></span><br>
            <strong>Fecha:</strong> <span th:text="${factura.fecha != null ? factura.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></span><br>
            <strong>Remito:</strong> <span th:text="${factura.remito != null ? factura.remito.id : ''}"></span><br>
            <strong>Estado:</strong> <span th:text="${factura.estado}"></span>
        </div>
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="det : ${factura.detalles}">
                    <td th:text="${det.producto != null ? det.producto.nombre : ''}"></td>
                    <td th:text="${det.cantidad}"></td>
                    <td th:text="${det.precioUnitario}"></td>
                    <td th:text="${det.cantidad * det.precioUnitario}"></td>
                </tr>
            </tbody>
        </table>
        <div class="text-end">
            <div><strong>Neto:</strong> <span th:text="${factura.neto}"></span></div>
            <div><strong>IVA:</strong> <span th:text="${factura.iva}"></span></div>
            <div><strong>Total:</strong> <span th:text="${factura.total}"></span></div>
        </div>
        <div class="mt-3">
            <a th:href="@{/facturas}" class="btn btn-secondary">Volver</a>
            <a th:href="@{/facturas/imprimir/{id}(id=${factura.id})}" class="btn btn-info">Imprimir</a>
            <form th:if="${factura.estado != 'ANULADA'}" th:action="@{/facturas/anular/{id}(id=${factura.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-warning" onclick="return confirm('Â¿Emitir Nota de CrÃ©dito y anular la factura?');">Anular (NC)</button>
            </form>
        </div>
    </div>
    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
