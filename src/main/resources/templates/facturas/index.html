<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Facturas</h3>
            <form class="d-flex" method="get" th:action="@{/facturas}">
                <input class="form-control me-2" type="text" name="q" placeholder="Buscar por cliente" th:value="${q}">
                <button class="btn btn-outline-primary" type="submit">Buscar</button>
            </form>
        </div>
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width:70px">#</th>
                            <th>Número</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Remito</th>
                            <th>Estado</th>
                            <th>Total</th>
                            <th style="width:220px">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="f, iter : ${page.content}">
                            <td th:text="${iter.count}"></td>
                            <td th:text="${f.numero}"></td>
                            <td th:text="${f.cliente}"></td>
                            <td th:text="${f.fecha != null ? f.fecha.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></td>
                            <td th:text="${f.remito != null ? f.remito.id : ''}"></td>
                            <td><span class="badge bg-dark" th:text="${f.estado}"></span></td>
                            <td th:text="${f.total}"></td>
                            <td>
                                <a th:href="@{/facturas/detalle/{id}(id=${f.id})}" class="btn btn-secondary btn-sm">Detalle</a>
                                <a th:href="@{/facturas/imprimir/{id}(id=${f.id})}" class="btn btn-info btn-sm">Imprimir</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <nav aria-label="Paginación" class="mt-3">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${page.first}? 'disabled'">
                    <a class="page-link" th:href="@{/facturas(page=${page.number-1},size=${page.size},q=${q})}">Anterior</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages-1)}" th:classappend="${i == page.number}? 'active'">
                    <a class="page-link" th:text="${i+1}" th:href="@{/facturas(page=${i},size=${page.size},q=${q})}"></a>
                </li>
                <li class="page-item" th:classappend="${page.last}? 'disabled'">
                    <a class="page-link" th:href="@{/facturas(page=${page.number+1},size=${page.size},q=${q})}">Siguiente</a>
                </li>
            </ul>
        </nav>
    </div>
    <div th:replace="footer :: footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
