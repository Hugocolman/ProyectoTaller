<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cliente - Documentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container my-4">
      <h2 class="mb-3">Cliente</h2>
      <p class="text-muted">Documentos: Recibo, Nota de entrega.</p>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card h-100 shadow-sm"><div class="card-body">
            <h5 class="card-title">Clientes (Maestro)</h5>
            <p class="card-text">Alta/edición de clientes.</p>
            <a class="btn btn-primary" th:href="@{/clientes}">Ir a Clientes</a>
          </div></div>
        </div>
        <div class="col-md-6">
          <div class="card h-100 shadow-sm"><div class="card-body">
            <h5 class="card-title">Entregas y recibos</h5>
            <p class="card-text">Comprobantes asociados a la entrega/venta.</p>
            <a class="btn btn-outline-primary" th:href="@{/ventas}">Ver Ventas</a>
          </div></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
