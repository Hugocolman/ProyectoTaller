<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proveedor - Documentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div th:replace="navbar :: navbar"></div>
    <div class="container my-4">
      <h2 class="mb-3">Proveedor</h2>
      <p class="text-muted">Documentos: Factura, Guía de envío.</p>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card h-100 shadow-sm"><div class="card-body">
            <h5 class="card-title">Proveedores (Maestro)</h5>
            <p class="card-text">Alta/edición de proveedores.</p>
            <a class="btn btn-primary" th:href="@{/proveedores}">Ir a Proveedores</a>
          </div></div>
        </div>
        <div class="col-md-6">
          <div class="card h-100 shadow-sm"><div class="card-body">
            <h5 class="card-title">Facturas de Proveedor</h5>
            <p class="card-text">Registro y consulta de facturas recibidas.</p>
            <a class="btn btn-outline-primary" th:href="@{/facturas}">Ver Facturas</a>
          </div></div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  </html>
