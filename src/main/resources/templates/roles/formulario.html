<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>body{padding-bottom:70px}</style>
</head>
<body>
<div th:replace="navbar :: navbar"></div>

<div class="container mt-4" style="max-width:600px;">
    <h3 class="mb-3" th:text="${rol.id} != null ? 'Editar Rol' : 'Nuevo Rol'">Nuevo Rol</h3>
    <div class="card p-3">
        <form th:action="@{/roles/guardar}" method="post" th:object="${rol}">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/roles}">Cancelar</a>
            </div>
        </form>
    </div>
    <div class="text-muted mt-2">Valores sugeridos: ADMIN, USER, VIEWER.</div>
    <div class="alert alert-info mt-3">Recuerda asignar roles a los usuarios en el mdulo Usuarios.</div>
    
</div>

<div th:replace="footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
