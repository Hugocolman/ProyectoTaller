<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Roles')">
    <script th:inline="javascript">
        function confirmarEliminar(id) {
            if (confirm('Â¿Eliminar este rol?')) {
                const form = document.createElement('form');
                form.method = 'post';
                form.action = '/roles/eliminar/' + id;
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
    
    <script>
        // noop
    </script>
</head>
<body th:replace="fragments/layout :: shell(~{::section})">
<section>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Roles</h3>
        <a class="btn btn-primary" th:href="@{/roles/nuevo}">Nuevo Rol</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th style="width:180px">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="rol : ${roles}">
                    <td th:text="${rol.id}">1</td>
                    <td th:text="${rol.nombre}">ADMIN</td>
                    <td>
                        <a class="btn btn-sm btn-secondary" th:href="@{|/roles/editar/${rol.id}|}">Editar</a>
                        <form th:action="@{|/roles/eliminar/${rol.id}|}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Â¿Eliminar?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</section>
</body>
</html>
