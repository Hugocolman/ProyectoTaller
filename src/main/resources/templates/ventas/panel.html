<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="navbar :: navbar"></div>
<div class="container mt-4">
    <h2 class="mb-3">Panel de Ventas</h2>
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted">Ventas totales</div>
                    <div class="h4 mb-0" th:text="${totalVentas}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted">Ventas hoy</div>
                    <div class="h4 mb-0" th:text="${ventasHoy}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="text-muted">Total facturado</div>
                    <div class="h4 mb-0">$ <span th:text="${#numbers.formatDecimal(totalFacturado,1,2)}">0.00</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">Top productos (por cantidad)</div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-sm align-middle">
                    <thead>
                        <tr><th>Producto</th><th class="text-end">Cantidad</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${topProductos}">
                            <td th:text="${e.key}">Producto</td>
                            <td class="text-end" th:text="${e.value}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
