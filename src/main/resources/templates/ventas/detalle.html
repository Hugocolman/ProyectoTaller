<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle de Venta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>
<div th:replace="navbar :: navbar"></div>
<div class="container mt-4">
  <h2 class="mb-3">Detalle de Venta</h2>
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4"><strong>Cliente:</strong> <span th:text="${venta.cliente}">-</span></div>
        <div class="col-md-4"><strong>Fecha:</strong> <span th:text="${venta.fecha}">-</span></div>
        <div class="col-md-4"><strong>Método de pago:</strong> <span th:text="${venta.metodoPago}">-</span></div>
        <div class="col-md-4"><strong>Total:</strong> $ <span th:text="${venta.total}">0.00</span></div>
      </div>
    </div>
  </div>
  <div class="card shadow-sm">
    <div class="card-header">Productos</div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr><th>Producto</th><th class="text-end">Cantidad</th><th class="text-end">Precio</th></tr></thead>
          <tbody>
            <tr th:each="d : ${venta.detalles}">
              <td th:text="${d.producto != null ? d.producto.nombre : '(Sin producto)'}">-</td>
              <td class="text-end" th:text="${d.cantidad}">0</td>
              <td class="text-end" th:text="${d.precioUnitario}">0.00</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <a th:href="@{/ventas/lista}" class="btn btn-secondary">Volver a la lista</a>
  </div>
</div>
<div th:replace="footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
