<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <div th:replace="navbar :: navbar"></div>

    <div class="container mt-4">
        <h2 class="text-center">Lista de Ventas</h2>
        <table class="table table-hover table-bordered mt-4">
            <thead class="table-primary">
                <tr>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>MÃ©todo de Pago</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="venta : ${ventas}">
                    <td th:text="${venta.cliente}"></td>
                    <td th:text="${venta.fecha}"></td>
                    <td th:text="${venta.total}"></td>
                    <td th:text="${venta.metodoPago}"></td>
                    <td>
                        <a th:href="@{/ventas/editar/{id}(id=${venta.id})}" class="btn btn-primary btn-sm">Editar</a>
                        <form th:action="@{/ventas/eliminar/{id}(id=${venta.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Â¿Eliminar esta venta?');">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>\r\n</div>

    <div th:replace="footer :: footer"></div>
</body>
</html>
